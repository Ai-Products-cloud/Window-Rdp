
name: Configure RDP User

on:
  workflow_dispatch:

jobs:
  configure-rdp:
    runs-on: windows-latest

    steps:
      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $username = "***"
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
              throw "RDP_PASSWORD secret is missing or empty."
          }

          $config = Join-Path $env:TEMP "security-policy.cfg"
          $db = Join-Path $env:TEMP "security-policy.sdb"

          secedit /export /cfg $config
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to export local security policy."
          }

          $content = Get-Content $config -Raw
          $content = $content -replace '(?m)^\s*PasswordComplexity\s*=\s*\d+', 'PasswordComplexity = 0'

          Set-Content -Path $config -Value $content -Encoding Unicode

          secedit /configure /db $db /cfg $config /areas SECURITYPOLICY
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to apply local security policy."
          }

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          $user = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($null -eq $user) {
              New-LocalUser `
                  -Name $username `
                  -Password $securePassword `
                  -Description "RDP User" `
                  -PasswordNeverExpires `
                  -AccountNeverExpires
          } else {
              Set-LocalUser -Name $username -Password $securePassword
          }

          Enable-LocalUser -Name $username

          $rdpGroup = Get-LocalGroup -SID 'S-1-5-32-555'
          Add-LocalGroupMember -Group $rdpGroup.Name -Member $username -ErrorAction SilentlyContinue

          Write-Host "RDP user setup completed."
